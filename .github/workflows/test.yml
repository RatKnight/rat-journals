# Runs the checks and unit tests on GitHub instead of a local PC. Started by hand
# (Actions → Tests → Run workflow, or `gh workflow run test.yml --ref <branch>`).

name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Frontend checks (types, lint, format)
        run: bun run check

      - name: Frontend tests
        run: bunx vitest run
