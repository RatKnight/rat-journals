[workspace]
# Match today's single-crate edition-2021 resolver to avoid feature-unification drift.
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.lints.clippy]
cognitive_complexity = { level = "warn", priority = -1 }

# MOVED from src-tauri/Cargo.toml — Cargo only honors [profile.*] in the workspace
# root, and silently ignores it in non-root members. Keeping it here preserves
# release-build LTO / opt-level=3 for the app crate.
[profile.release]
opt-level = 3
lto = true

# Argon2id runs on every password slot a test creates; unoptimized it is roughly 10x
# slower, which made the 256 MiB slot parameters crawl in debug test runs. Release builds
# are unaffected (they are fully optimized anyway).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
